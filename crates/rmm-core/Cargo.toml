[package]
name = "rmm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
walkdir = "2"
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "lzma", "ppmd", "time", "xz"] }
sevenz-rust2 = "0.25"
libloadorder = "18"
esplugin = "6"
fd-lock = "4"
schemars = "1"
# Both already come in through libloadorder/walkdir.
same-file = "1"
dirs = "6"
roxmltree = "0.21.2"
libloot = "0.29.7"

[features]
default = ["zstd"]
# Zstandard zips. Its C library needs a compiler for the target, so cross-checks from Windows
# (`cargo check --target x86_64-unknown-linux-gnu --no-default-features`) turn it off.
zstd = ["zip/zstd"]

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "3"
members = ["crates/rmm-core", "crates/rmm", "crates/rmm-app"]
# The desktop app needs WebView2 (Windows) or WebKitGTK (Linux); plain `cargo build`/`test` skip it.
default-members = ["crates/rmm-core", "crates/rmm"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ThinhCaoCow/rust-mod-manager"

[workspace.dependencies]
rmm-core = { path = "crates/rmm-core", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
